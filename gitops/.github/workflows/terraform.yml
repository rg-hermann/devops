name: Terraform Pipeline

on:
  push:
    branches:
      - develop
      - release/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - release/*

env:
  TF_VERSION: '1.5.0'
  TF_WORKING_DIR: './terraform'
  TF_BACKEND_CONFIG: './backend-config'

jobs:
  terraform:
    name: Terraform Workflow
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure Terraform Backend
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            cp ${{ env.TF_BACKEND_CONFIG }}/develop.tfbackend ${{ env.TF_WORKING_DIR }}/backend.tf
          elif [[ "${{ github.ref }}" == "refs/heads/release/"* ]]; then
            cp ${{ env.TF_BACKEND_CONFIG }}/release.tfbackend ${{ env.TF_WORKING_DIR }}/backend.tf
          elif [[ "${{ github.ref }}" == "refs/tags/v"* ]]; then
            cp ${{ env.TF_BACKEND_CONFIG }}/prd.tfbackend ${{ env.TF_WORKING_DIR }}/backend.tf
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config=backend.tf

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/release/*' || startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
